<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Markdown Parser</title>
</head>
<body>
    <h1>Test Markdown Parser</h1>
    
    <h2>Input:</h2>
    <textarea id="input" rows="10" cols="80" style="font-family: monospace;"># Họ đã nói với tôi có thể có một trận đấu với JDM vào tháng 3 hoặc tháng 4...
## Medium Heading
### Small Heading
**Bold text**
*Italic text*
==Highlighted text==
[Link text](https://example.com)
---
Normal paragraph</textarea>
    
    <button onclick="testParse()">Parse</button>
    
    <h2>Output:</h2>
    <div id="output" style="border: 1px solid #ccc; padding: 20px; min-height: 200px;"></div>
    
    <h2>HTML Source:</h2>
    <pre id="source" style="background: #f5f5f5; padding: 10px; overflow-x: auto;"></pre>

    <script>
        function parseMarkdown(text, textAlign = 'center') {
            if (!text) return '';
            
            const lines = text.split('\n');
            const parsed = lines.map(line => parseLine(line.trim(), textAlign)).filter(Boolean);
            
            return parsed.join('');
        }

        function parseLine(line, textAlign) {
            if (!line) return '<br>';
            
            // Divider: ---
            if (line === '---') {
                return '<hr style="border: none; border-top: 1px solid currentColor; opacity: 0.2; margin: 16px 0;">';
            }
            
            // Heading 1: # Text
            if (line.startsWith('# ')) {
                const content = parseInline(line.slice(2));
                return `<h1 style="text-align: ${textAlign}; font-size: 28px; font-weight: 700; line-height: 1.2; margin: 16px 0 8px 0;">${content}</h1>`;
            }
            
            // Heading 2: ## Text
            if (line.startsWith('## ')) {
                const content = parseInline(line.slice(3));
                return `<h2 style="text-align: ${textAlign}; font-size: 22px; font-weight: 600; line-height: 1.3; margin: 12px 0 6px 0;">${content}</h2>`;
            }
            
            // Heading 3: ### Text
            if (line.startsWith('### ')) {
                const content = parseInline(line.slice(4));
                return `<h3 style="text-align: ${textAlign}; font-size: 18px; font-weight: 600; line-height: 1.4; margin: 10px 0 4px 0;">${content}</h3>`;
            }
            
            // Normal paragraph
            const content = parseInline(line);
            return `<p style="text-align: ${textAlign}; font-size: 16px; line-height: 1.6; margin: 8px 0;">${content}</p>`;
        }

        function parseInline(text) {
            return text
                // Links: [text](url)
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">$1</a>')
                // Highlight: ==text==
                .replace(/==([^=]+)==/g, '<mark style="background-color: #fef08a; padding: 2px 4px; border-radius: 2px;">$1</mark>')
                // Bold: **text**
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                // Italic: *text*
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function testParse() {
            const input = document.getElementById('input').value;
            const html = parseMarkdown(input, 'center');
            
            document.getElementById('output').innerHTML = html;
            document.getElementById('source').textContent = html;
            
            console.log('Input:', input);
            console.log('Output:', html);
        }
        
        // Auto-parse on load
        testParse();
    </script>
</body>
</html>
